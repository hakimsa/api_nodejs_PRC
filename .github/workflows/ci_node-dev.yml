
name: Node.js CI with Express

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '17'
        cache: npm
    - name: Build with node project
      run: node index.js
    - name: Run tests
      run: npm test
